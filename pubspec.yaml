name: lab_inventory
description: Sistema de Gestión de Inventario de Laboratorio con Control de Lotes
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.0

  # Local Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^12.1.3

  # Utils
  path_provider: ^2.1.2
  path: ^1.8.3
  uuid: ^4.3.3
  intl: ^0.18.1
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2

  # UI / Charts
  fl_chart: ^0.66.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - web/sqlite3.wasm

